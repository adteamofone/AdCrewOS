[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcrewos"
version = "0.2.0"
description = "AI backbone for independent media buyers and freelance advertisers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AdCrewOS Team", email = "contact@example.com"},
]
keywords = ["advertising", "automation", "ai", "monitoring", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "tqdm>=4.65.0",
    "pytz>=2023.3",
    "python-dateutil>=2.8.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "markdown>=3.4.0",
    "aiosmtplib>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "httpx>=0.24.0",
]
cli = [
    "prompt-toolkit>=3.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]
database = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "pydantic>=2.0.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/adcrewos/adcrewos"
Repository = "https://github.com/adcrewos/adcrewos"
Documentation = "https://adcrewos.readthedocs.io"

[project.scripts]
adcrewos = "adcrewos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_mode = "auto"
