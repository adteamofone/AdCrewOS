name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (weasyprint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libgdk-pixbuf2.0-0 libcairo2 librsvg2-1

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install weasyprint

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check import works
        run: python -c "import adcrewos; print(f'adcrewos v{adcrewos.__version__}')"